<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>飲食石蕊試紙｜三角色營養分析</title><link rel="stylesheet" href="styles.css">
</head>
<body><main class="shell">
  <header class="hero"><div><span class="eyebrow">DIETARY LITMUS TEST</span><h1>飲食石蕊試紙</h1><p>把飲食紀錄交給三個 AI 角色，完成標準化、結構分析與營養公式覆核。</p></div><div class="actions"><button class="btn light" id="demoBtn">載入示範資料</button><label class="btn outline" for="csvInput">匯入 CSV</label><input id="csvInput" type="file" accept=".csv,text/csv" hidden></div></header>
  <section class="capture card"><div class="capture-copy"><div class="icon">＋</div><div><h2>新增飲食紀錄</h2><p>可手動輸入，或選取照片作為 AI 辨識流程示範。</p></div></div><div class="actions"><button class="btn primary" id="photoBtn">拍照／選取照片</button><button class="btn soft" id="manualBtn">手動輸入</button></div><input id="photoInput" type="file" accept="image/*" hidden></section>
  <section class="dashboard-head"><div><span class="eyebrow dark">分析儀表板</span><h2 id="periodTitle">本週摘要</h2></div><nav class="tabs"><button class="tab active" data-period="week">本週</button><button class="tab" data-period="day">今日</button><button class="tab" data-period="month">本月</button></nav><button class="profile" id="profileBtn"><b id="profileName">建立個人目標</b><small>設定每日建議值</small></button></section>
  <section class="recommendations" id="recommendations"></section><section class="metrics" id="metrics"></section>
  <section class="grid"><article class="card panel"><div class="panel-head"><div><span class="eyebrow dark">趨勢追蹤</span><h3>熱量與糖分</h3></div><span class="pill">已完成標準化</span></div><div id="trend" class="trend"></div><div class="legend"><span><i class="dot green"></i>熱量 kcal</span><span><i class="dot yellow"></i>糖分 g</span></div></article><article class="card panel"><div class="panel-head"><div><span class="eyebrow dark">營養結構</span><h3>PFC 比例</h3></div></div><div class="pfc"><div class="donut" id="donut"><span>100%</span></div><div id="pfcList"></div></div></article></section>
  <section class="grid lower"><article class="card panel"><div class="panel-head"><div><span class="eyebrow dark">最近紀錄</span><h3>已確認的飲食項目</h3></div><button class="text-btn" id="clearBtn">清除資料</button></div><div id="records"></div></article><article class="card panel"><span class="eyebrow dark">三角色執行狀態</span><h3>可追溯的分析流程</h3><div id="pipeline" class="pipeline"></div><div id="insights" class="insights"></div></article></section>
  <footer>本工具提供資料分析示範，不是醫療診斷或個人化醫療建議。</footer>
</main>
<dialog id="manualDialog"><form method="dialog" id="manualForm" class="form"><div class="form-head"><h3>新增飲食紀錄</h3><button value="cancel">×</button></div><label>品項名稱<input name="item_name" required placeholder="例如：雞胸便當"></label><div class="two"><label>日期<input name="date" type="date" required></label><label>餐別<select name="meal_type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select></label></div><div class="two"><label>熱量 kcal<input name="kcal" type="number" min="0" required></label><label>糖分 g<input name="sugar_g" type="number" min="0" required></label></div><div class="three"><label>蛋白質 g<input name="protein_g" type="number" min="0" value="0"></label><label>脂肪 g<input name="fat_g" type="number" min="0" value="0"></label><label>碳水 g<input name="carbs_g" type="number" min="0" value="0"></label></div><button class="btn primary full" value="default">加入分析</button></form></dialog>
<dialog id="profileDialog"><form method="dialog" id="profileForm" class="form"><div class="form-head"><h3>個人目標</h3><button value="cancel">×</button></div><div class="two"><label>身高 cm<input name="height" type="number" min="80" max="250" required></label><label>體重 kg<input name="weight" type="number" min="25" max="300" step="0.1" required></label></div><div class="two"><label>年齡<input name="age" type="number" min="13" max="100" required></label><label>性別<select name="sex"><option value="female">女性</option><option value="male">男性</option></select></label></div><label>活動量<select name="activity"><option value="1.2">久坐</option><option value="1.375">每週運動 1–3 天</option><option value="1.55">每週運動 3–5 天</option></select></label><label>目標<select name="goal"><option value="maintain">維持體重</option><option value="lose">減脂</option><option value="gain">增加肌肉</option></select></label><button class="btn primary full" value="default">儲存目標</button></form></dialog>
<dialog id="photoDialog"><form method="dialog" id="photoForm" class="form"><div class="form-head"><h3>確認照片辨識結果</h3><button value="cancel">×</button></div><img id="photoPreview" class="photo-preview" alt="待確認的食物照片"><p class="photo-note">AI 辨識是示範流程，請確認品項與估算營養後再加入。</p><label>辨識品項<input name="item_name" required></label><div class="two"><label>熱量 kcal<input name="kcal" type="number" min="0" required></label><label>糖分 g<input name="sugar_g" type="number" min="0" required></label></div><div class="three"><label>蛋白質 g<input name="protein_g" type="number" min="0" value="0"></label><label>脂肪 g<input name="fat_g" type="number" min="0" value="0"></label><label>碳水 g<input name="carbs_g" type="number" min="0" value="0"></label></div><div class="two"><button class="btn soft full" value="cancel">取消</button><button class="btn primary full" value="default">確認加入</button></div></form></dialog>
<script src="app.js"></script></body></html>
